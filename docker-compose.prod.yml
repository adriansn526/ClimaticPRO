version: "3.8"

networks:
  proxy:
    external: true
  default:
    driver: bridge

services:
  redis:
    image: redis:7-alpine
    restart: always
    command: ["redis-server","--save","","--appendonly","no"]
    networks:
      - proxy

  postgres:
    image: postgres:15-alpine
    restart: always
    environment:
      POSTGRES_USER: climatic_app
      POSTGRES_PASSWORD: AppPassword123!
      POSTGRES_DB: climatic_app_db
    volumes:
      - ./postgres_data:/var/lib/postgresql/data
    networks:
      - proxy
    ports:
      - "5440:5432"

  mariadb:
    image: mariadb:10.11
    restart: always
    environment:
      MYSQL_ROOT_PASSWORD: XWBTMMTF0KWTEp7wVzrY
      MYSQL_DATABASE: climaticpro_wp
      MYSQL_USER: climaticpro_wp
      MYSQL_PASSWORD: XWBTMMTF0KWTEp7wVzrY
    volumes:
      - ./mariadb:/var/lib/mysql
    networks:
      - proxy

  wordpress:
    image: wordpress:6-apache
    restart: always
    depends_on:
      - redis
      - mariadb
    networks:
      - proxy
    environment:
      WORDPRESS_DB_HOST: mariadb:3306
      WORDPRESS_DB_USER: climaticpro_wp
      WORDPRESS_DB_PASSWORD: XWBTMMTF0KWTEp7wVzrY
      WORDPRESS_DB_NAME: climaticpro_wp
      WP_HOME: https://cms.climaticpro.ro
      WP_SITEURL: https://cms.climaticpro.ro
      WORDPRESS_DEBUG: '0'
      WORDPRESS_CONFIG_EXTRA: |
        define('WP_REDIS_HOST','redis');
        define('WP_REDIS_PORT',6379);
        define('WP_CACHE', true);
        define('WP_DEBUG_LOG', false);
        define('WP_DEBUG_DISPLAY', false);
        if (isset($$_SERVER['HTTP_X_FORWARDED_PROTO']) && $$_SERVER['HTTP_X_FORWARDED_PROTO'] === 'https') {
            $$_SERVER['HTTPS'] = 'on';
        }
    volumes:
      - ./wordpress:/var/www/html
      - ./uploads:/var/www/html/wp-content/uploads
      - ./php-uploads.ini:/usr/local/etc/php/conf.d/uploads.ini
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.climaticpro-wp.rule=Host(`cms.climaticpro.ro`)"
      - "traefik.http.routers.climaticpro-wp.entrypoints=websecure"
      - "traefik.http.routers.climaticpro-wp.tls.certresolver=httpresolver"
      - "traefik.http.services.climaticpro-wp.loadbalancer.server.port=80"
    ports:
      - "8092:80"

  frontend:
    # Uses the image built by GitHub Actions
    image: climaticpro-frontend:latest
    pull_policy: never
    ports:
      - "3010:3000"
    restart: always
    dns:
      - 8.8.8.8
      - 1.1.1.1
    env_file:
      - frontend/.env.local
    environment:
      - NEXT_PUBLIC_WORDPRESS_API_URL=https://cms.climaticpro.ro/graphql
      - NEXT_PUBLIC_SITE_URL=https://dev.climaticpro.ro
      - WOOCOMMERCE_CONSUMER_KEY=ck_478c6b7d67abbe57217778d048b8b5b5392cda4d
      - WOOCOMMERCE_CONSUMER_SECRET=cs_f27ad42ddb71fb5c64800be288b939598b21494f
      - DATABASE_URL=postgresql://climatic_app:AppPassword123!@postgres:5432/climatic_app_db
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.climaticpro-frontend.rule=Host(`dev.climaticpro.ro`)"
      - "traefik.http.routers.climaticpro-frontend.entrypoints=websecure"
      - "traefik.http.routers.climaticpro-frontend.tls.certresolver=httpresolver"
      - "traefik.http.services.climaticpro-frontend.loadbalancer.server.port=3000"
    networks:
      - proxy
      - default
